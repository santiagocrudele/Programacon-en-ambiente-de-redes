<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Sentencias</title>
</head>
<body>
    <!-- 1. Escritura pura en HTML -->
    <p>Escritura 1: Texto que ya viene escrito con el documento en HTML puro.</p>
    
    <!-- 2 y 3. Primer script con document.write y Alerta -->
    <script>
        document.write("<p>Escritura 2: Texto escrito desde adentro de JavaScript con el método document.write(). No pisa el documento porque todavía el flujo de escritura no terminó.</p>");
        alert("Número 3: Primera alerta");
    </script>

    <!-- 4. Segunda escritura pura en HTML -->
    <p>Escritura 4: Nuevo texto escrito directamente en el documento HTML.</p>

    <!-- 5 y 6. Segundo script con document.write y Alerta final -->
    <script>
        document.write("<p>Escritura 5: Otra escritura con JavaScript. El texto no pisa lo que está en el viewport porque no terminó el flujo.</p>");
        alert("Alerta 6: Última alerta");
    </script>
</body>
</html>
