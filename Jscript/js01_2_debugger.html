<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Debugger</title>
</head>
<body>
    <h2>Ejercicio 2: Uso del Debugger y Consola</h2>
    <p>El siguiente código está siendo ejecutado a continuación. (Presione <strong>F12</strong> o haga Clic derecho > Inspeccionar, y vaya a la pestaña <strong>Consola</strong> para ver el resultado).</p>
    
    <!-- Muestra el código en pantalla como pidió el profe -->
    <pre style="background-color: #f4f4f4; padding: 15px; border: 1px solid #ccc;">
var a = 4;
var b = 6;
var c = a + b;
console.log("El valor de la variable C es: " + c);
    </pre>

    <!-- Ejecuta el script real -->
    <script>
        var a = 4;
        var b = 6;
        var c = a + b;
        
        // Imprime el resultado en la consola del navegador
        console.log("El valor de la variable C es: " + c);
    </script>
</body>
</html>
