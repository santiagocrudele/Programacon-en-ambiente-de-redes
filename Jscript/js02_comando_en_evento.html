<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Comando en Evento</title>
</head>
<body>
    <h2>Ejercicio 3: Comando en Evento</h2>
    <p>Hacé clic en los botones para ejecutar diferentes comandos en respuesta a un evento.</p>
    
    <!-- Botón 1: Llama a un alert -->
    <button onclick="ejecutarAlerta()">Ejecutar Alerta</button>

    <!-- Botón 2: Ejecuta document.write -->
    <button onclick="ejecutarEscritura()">Ejecutar document.write</button>

    <script>
        function ejecutarAlerta() {
            alert("Esta es una ventana de alerta disparada por el evento clic. No modifica la página.");
        }

        function ejecutarEscritura() {
            // Como esto se ejecuta DESPUÉS de que la página ya cargó, pisa todo el contenido.
            document.write("Hola. Esta escritura pisa la anterior, reemplaza el documento que se estaba visualizando porque el flujo de escritura ya había terminado.");
        }
    </script>
</body>
</html>
