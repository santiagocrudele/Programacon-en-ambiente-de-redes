<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5 - Alcance</title>
</head>
<body>
    <h2>Ejercicio 5: Alcance (Scope) de Variables</h2>
    <p>Interactuá con los botones para ver cómo cambian los valores.</p>
    
    <button id="btnLocal">1. Declaración y asignación local</button>
    <button id="btnForzada">2. Asignación forzada (sin var)</button>
    <button id="btnGlobal">3. Muestra la variable global</button>

    <script>
        // Declaración de variable global sin asignación
        var miVariable;
        
        // Alerta inicial automática
        alert("Variable global declarada sin asignación.\nValor: " + miVariable + "\nTipo: " + typeof(miVariable));

        // Funciones anónimas asociadas a los botones
        document.getElementById('btnLocal').onclick = function() {
            var miVariable = prompt("Ingresá un valor (Declaración LOCAL):", "mm");
            alert("El valor de la variable ingresado es: " + miVariable + "\nTipo: " + typeof(miVariable));
        };

        document.getElementById('btnForzada').onclick = function() {
            miVariable = prompt("Ingresá un valor (Asignación FORZADA global):", "PP");
            alert("El valor cargado es: " + miVariable + "\nTipo: " + typeof(miVariable));
        };

        document.getElementById('btnGlobal').onclick = function() {
            alert("El valor de la variable global es: " + miVariable + "\nTipo: " + typeof(miVariable));
        };
    </script>
</body>
</html>
